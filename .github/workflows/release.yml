name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential binutils make python3 curl ca-certificates xz-utils file \
            xorriso qemu-system-x86 git

      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          make BUILD=release iso
          make test
          cp build/release/sobi.iso "sobi-os-${GITHUB_REF_NAME}.iso"
          sha256sum "sobi-os-${GITHUB_REF_NAME}.iso" > "sobi-os-${GITHUB_REF_NAME}.iso.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sobi-os-${{ github.ref_name }}.iso
            sobi-os-${{ github.ref_name }}.iso.sha256
          body: |
            Bootable SOBI OS image (hybrid BIOS/UEFI ISO).

            Run it with:

                qemu-system-x86_64 -M q35 -m 256M -cdrom sobi-os-${{ github.ref_name }}.iso -serial stdio

            See CHANGELOG.md for what changed.
